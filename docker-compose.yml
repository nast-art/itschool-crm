services:
  postgres:
    image: postgres:16
    container_name: crm-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: it_school_crm_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    networks:
      - crm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d it_school_crm_db"]
      interval: 10s
      timeout: 3s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    container_name: crm-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/itschool-realm.json:/opt/keycloak/data/import/itschool-realm.json
    depends_on:
      - postgres
    networks:
      - crm-network

  # ===== KeyDB (кэш) =====
  keydb:
    image: eqalpha/keydb:latest
    container_name: itschoolcrm-keydb
    restart: unless-stopped
    command: >
      keydb-server
      --appendonly yes
      --save 60 1
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - keydb_data:/data
    networks:
      - crm-network
    healthcheck:
      test: ["CMD", "keydb-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ===== API =====
  api:
    build:
      context: ./backend/ITSchoolCRM.API
      dockerfile: Dockerfile
    container_name: itschoolcrm-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      keydb:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=it_school_crm_db;Username=postgres;Password=${DB_PASSWORD:-postgres}
      - ConnectionStrings__Keydb=keydb:6379,abortConnect=false
      - Keycloak__Authority=http://keycloak:8080/realms/itschool
      - Keycloak__Audience=itschool-crm-api
      - Keycloak__RequireHttpsMetadata=false
      - Keycloak__Url=http://keycloak:8080
      - Keycloak__Realm=itschool
      - Keycloak__PublicClientId=itschool-crm-frontend
      - Keycloak__AdminClientId=itschool-crm-admin
      - Keycloak__AdminClientSecret=${KEYCLOAK_ADMIN_CLIENT_SECRET}
      - Keycloak__DefaultRole=user
      # S3 (Yandex Cloud) — секреты через .env, не коммитить:
      - Storage__S3__Bucket=${S3_BUCKET}
      - Storage__S3__ServiceUrl=${S3_SERVICE_URL}
      - Storage__S3__Region=${S3_REGION}
      - Storage__S3__AccessKey=${S3_ACCESS_KEY}
      - Storage__S3__SecretKey=${S3_SECRET_KEY}
      - Storage__S3__ForcePathStyle=false
    ports:
      - "5026:8080"
    networks:
      - crm-network

  # ===== Фронтенд =====
  frontend:
    build:
      context: ./frontend/ITSchoolCRMWEB
      dockerfile: Dockerfile
    container_name: itschoolcrm-frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"
    networks:
      - crm-network

volumes:
  pgdata:
  keydb_data:

networks:
  crm-network:
    driver: bridge